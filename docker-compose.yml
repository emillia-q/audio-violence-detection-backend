version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: audio_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_EXTERNAL}:5432"
    volumes:
      - audio_db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: audio_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
    ports:
      - "${PGADMIN_PORT_EXTERNAL}:80"
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: audio_redis
    restart: always
    ports:
      - "${REDIS_PORT_EXTERNAL}:6379"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: audio_mqtt
    restart: always
    ports:
      - "${MQTT_PORT_EXTERNAL}:1883"
    volumes:
      - ./mosquitto-config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  kafka:
    image: redpandadata/redpanda:latest
    container_name: audio_kafka
    restart: always
    ports:
      - "${KAFKA_PORT_EXTERNAL}:19092"
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092

volumes:
  audio_db_data: